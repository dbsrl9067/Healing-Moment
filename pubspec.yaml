name: healing_moments
description: A new Flutter project for healing moments.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  home_widget: ^0.9.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  flutter_timezone: ^2.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  just_audio: ^0.9.36
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  webview_flutter: ^4.4.2
  permission_handler: ^11.0.1
  url_launcher: ^6.2.1
  firebase_storage: ^12.4.10
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
